<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R34 Anarchy — Platypus Anarchy Minecraft Server</title>
<meta name="description" content="R34 Anarchy — server Minecraft thể loại Platypus Anarchy. Không luật, không shop, không p2w. Slimefun + CrazyEnchant. Java 26.1.2, Bedrock crossplay.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/server-icon.png">
</head>
<body
  data-servers='[
    {"label":"r34.cc.cd","java":"r34.cc.cd:25565","bedrock":"r34.cc.cd:19132"},
    {"label":"servernotdie.cc.cd","java":"servernotdie.cc.cd:25565","bedrock":"servernotdie.cc.cd:19132"}
  ]'
>

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <img class="brand-icon" src="assets/server-icon.png" alt="R34 Anarchy" width="34" height="34">
        R34 Anarchy
      </div>
      <div class="status-pill" id="status-pill">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-label">Đang kiểm tra…</span>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-logo-row">
          <img class="hero-logo" src="assets/server-icon.png" alt="" width="72" height="72">
          <span class="hero-eyebrow">Platypus Anarchy · Java 26.1.2</span>
        </div>

        <div class="server-card">
          <div class="players">
            <span class="count is-loading" id="player-count">–</span>
            <span class="sep">/</span>
            <span class="max" id="player-max">–</span>
            <span class="label">Người chơi đang online</span>
          </div>
          <div class="motd" id="motd"></div>
        </div>

        <div class="ip-picker" role="group" aria-label="Chọn server và phiên bản">
          <div class="picker-group" id="server-picker"></div>
          <div class="picker-group" id="edition-picker">
            <button class="picker-btn is-active" data-edition="java" type="button">Java</button>
            <button class="picker-btn" data-edition="bedrock" type="button">Bedrock</button>
          </div>
        </div>

        <div class="ip-row">
          <div class="ip-value" id="ip-value">đang tải…</div>
          <button class="copy-btn" id="copy-btn" type="button">Copy IP</button>
        </div>
      </div>
    </section>

    <section class="content-section">
      <div class="wrap">
        <div class="section-label">Giới thiệu</div>
        <article class="markdown-body is-loading" id="markdown-body">
          Đang tải nội dung…
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Make by mytai20100</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
